data:
    value:
        loader:
            batch_size: 1
            frame_size:
                - 224
                - 224
            num_workers: 2
            sequence_length: 8
            shuffle: true
        preprocessing:
            augmentations: []
            normalize: true
evaluation:
    value:
        metrics:
            - mse
            - ssim
            - lpips
            - temporal_consistency
        save_predictions: true
        test_batch_size: 1
logging:
    value:
        experiment_name: baseline
        log_frequency: 100
        project_name: tcc-multimodal-fusion
        save_model_frequency: 10
        use_wandb: true
model:
    value:
        depth:
            model_name: depth-anything/Depth-Anything-V2-Small-hf
            name: depth_anything_v2
            pretrained: true
        fusion:
            fusion_dim: 256
            num_attention_heads: 4
            output_dim: 128
            use_temporal: false
        pose:
            min_detection_confidence: 0.5
            min_tracking_confidence: 0.5
            model_complexity: 1
            smooth_landmarks: true
            static_image_mode: false
        segmentation:
            name: deeplabv3_resnet50
            num_classes: 21
            pretrained: true
        video_embeddings:
            architecture: 3dcnn
            embedding_dim: 256
            spatial_size: 112
            temporal_depth: 16
paths:
    value:
        checkpoint_dir: ./checkpoints
        data_root: ./data
        log_dir: ./logs
        output_dir: ./outputs
training:
    value:
        device: cpu
        gradient_clip: 1
        loss:
            consistency_weight: 0.5
            reconstruction_weight: 1
            temporal_weight: 0.3
        mixed_precision: false
        optimizer:
            betas:
                - 0.9
                - 0.999
            learning_rate: 0.0001
            name: adamw
            weight_decay: 1e-05
        save_frequency: 5
        scheduler:
            max_epochs: 20
            name: cosine
            warmup_epochs: 5
        validation_frequency: 2
