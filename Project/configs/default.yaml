# Configuração padrão para o modelo multimodal

model:
  # Configuração do modelo de profundidade
  depth:
    name: "depth_anything_v2"
    model_name: "depth-anything/Depth-Anything-V2-Small-hf"
    pretrained: true
    
  # Configuração da segmentação
  segmentation:
    name: "deeplabv3_resnet50"
    num_classes: 21
    pretrained: true
    
  # Configuração do pose estimation
  pose:
    static_image_mode: false
    model_complexity: 1
    smooth_landmarks: true
    min_detection_confidence: 0.5
    min_tracking_confidence: 0.5
    
  # Configuração da fusão multimodal
  fusion:
    fusion_dim: 256
    output_dim: 128
    use_temporal: false
    num_attention_heads: 4
    
  # Configuração dos embeddings de vídeo
  video_embeddings:
    embedding_dim: 256
    temporal_depth: 16
    spatial_size: 112
    architecture: "3dcnn"

# Configuração dos dados
data:
  loader:
    batch_size: 1
    sequence_length: 8
    frame_size: [224, 224]
    num_workers: 2
    shuffle: true
    
  preprocessing:
    normalize: true
    augmentations: []

# Configuração de treinamento
training:
  optimizer:
    name: "adamw"
    learning_rate: 0.0001
    weight_decay: 0.00001
    betas: [0.9, 0.999]
    
  scheduler:
    name: "cosine"
    warmup_epochs: 5
    max_epochs: 20
    
  loss:
    reconstruction_weight: 1.0
    consistency_weight: 0.5
    temporal_weight: 0.3
    
  device: "cpu"
  mixed_precision: false
  gradient_clip: 1.0
  save_frequency: 5
  validation_frequency: 2

# Configuração de avaliação
evaluation:
  metrics:
    - "mse"
    - "ssim"
    - "lpips"
    - "temporal_consistency"
    
  test_batch_size: 1
  save_predictions: true

# Configuração de logging
logging:
  use_wandb: true
  project_name: "tcc-multimodal-fusion"
  experiment_name: "baseline"
  log_frequency: 100
  save_model_frequency: 10

# Caminhos
paths:
  data_root: "./data"
  output_dir: "./outputs"
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"