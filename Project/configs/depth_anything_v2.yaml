# Configuração para experimentos com Depth Anything V2

model:
  depth:
    name: "depth_anything_v2"
    model_name: "depth-anything/Depth-Anything-V2-Large-hf"  # Modelo maior
    pretrained: true
    
  segmentation:
    name: "deeplabv3_resnet50"
    num_classes: 21
    pretrained: true
    
  fusion:
    fusion_dim: 768  # Dimensão maior para melhor capacidade
    output_dim: 512
    use_temporal: true
    num_attention_heads: 12

training:
  optimizer:
    learning_rate: 5e-5  # LR menor para modelo maior
    
  scheduler:
    max_epochs: 150
    
logging:
  experiment_name: "depth_anything_v2_large"